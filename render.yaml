services:
  - type: web
    name: gof-olympiad
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: gof-olympiad.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://gof-olympiad.onrender.com
      - key: SITE_URL
        value: https://gof-olympiad.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: gof-db
          property: connectionString
databases:
  - name: gof-db
    plan: free
